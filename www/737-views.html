<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>737 Views — xplapi demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; color: #e8f5bc; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    .float-btn { position: absolute; z-index: 100; }
    .btn-page {
      background: rgba(173, 247, 98, 0.995); border: 2px solid #aaa; border-radius: 15px;
      color: #242423; cursor: pointer; font-size: 16px; font-weight: 600; padding: 16px 24px;
      min-height: 60px;
    }
    .btn-view {
      background: rgba(200, 200, 200, 0.45); border: 2px solid #aaa; border-radius: 15px;
      color: #e8f5bc; cursor: pointer; font-size: 16px; font-weight: 600; padding: 16px 24px;
      min-height: 60px; transition: all 300ms;
    }
    .btn-view:hover { color: #1a1a1a; background: #fff; box-shadow: 0 8px 15px rgba(0,0,0,0.25); transform: translateY(-2px); }
    .btn-view:active { box-shadow: none; transform: translateY(0); }
    .img-center { display: block; margin: 0 auto; }
    .view-frame { transform: scale(0.75); transform-origin: top left; }
    .view-panel { position: relative; width: 800px; margin: 0 auto; }
    .cockpit-placeholder { width: 800px; height: 450px; background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%); display: flex; align-items: center; justify-content: center; color: #666; font-size: 18px; }
    #error-msg { display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #ff6b6b; color: white; padding: 20px 30px; border-radius: 10px; z-index: 1000; max-width: 600px; text-align: center; font-weight: bold; }
    .nav-link { position: absolute; top: 10px; left: 100px; z-index: 101; color: #58a6ff; text-decoration: none; font-size: 14px; }
    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a class="nav-link" href="/state">Status</a>
  <button id="btnIn" class="float-btn btn-page" style="top: 10px; left: 10px;">IN</button>
  <button id="btnOut" class="float-btn btn-page" style="top: 10px; right: 10px;">OUT</button>

  <div id="inFrame" class="view-frame">
    <div class="view-panel" id="internalViews">
      <img class="img-center" id="cockpitImg" src="737-views/cockpit-m.jpg" alt="Cockpit" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="cockpit-placeholder" id="cockpitPlaceholder" style="display: none;">Cockpit — copy cockpit-m.jpg to www/737-views/ from fs-web-panels</div>
    </div>
  </div>
  <div id="outFrame" class="view-frame" style="display: none; padding-top: 50px;">
    <div class="view-panel" id="outViews" style="padding-top: 50px;">
      <img class="img-center" src="737-views/plane-4002.svg" width="600" alt="737" />
    </div>
  </div>

  <div id="error-msg"></div>

  <script>

    const inButtons = [

      { style: 'top: 250px; right: 5%;', text: 'Right' },
      { style: 'top: 350px; left: 2%;', text: 'Tablet' },
      { style: 'top: 320px; right: 48%', text: 'Cockpit' },

      { style: 'bottom: 50px; left: 50%; transform: translate(-50%, 0);', text: 'Pedestal' },
      { style: 'bottom: 5px; left: 5px;', text: 'Fly by' },
      { style: 'bottom: 5px; right: 5px;', text: 'Chase' },
    ];

    const outButtons = [
      { style: 'top: -20px; left: 50%; transform: translate(-50%, 0);', text: 'Front' },
      { style: 'top: 250px; left: 5%;', text: 'From left' },
      { style: 'top: 250px; right: 7%;', text: 'From right' },
      { style: 'top: 0px; left: 20%;', text: 'Fly by' },

    const viewCoordinates = [

      { name: 'Gear', datarefs: { 'sim/graphics/view/pilots_head_x': 3.1579, 'sim/graphics/view/pilots_head_y': -2.6286, 'sim/graphics/view/pilots_head_z': 12.968, 'sim/graphics/view/pilots_head_psi': 352, 'sim/graphics/view/pilots_head_the': -2, 'sim/graphics/view/pilots_head_phi': 0 } },
      { name: 'Fly by', command: 'sim/view/still_spot' },
      { name: 'Chase', command: 'sim/view/chase' },
    ];

    async function setDatarefs(datarefs) {
      const r = await fetch(API + '/api/dataref/write', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datarefs),
      });
      if (!r.ok) throw new Error('setMultiple failed: ' + r.status);
    }

    async function executeCommand(name) {
      const r = await fetch(API + '/api/command/once', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      if (!r.ok) throw new Error('command failed: ' + r.status);
    }

    async function onButtonClick(text) {
      const v = viewCoordinates.find(vc => vc.name === text);
      if (!v) return;
      try {
        if (v.datarefs) await setDatarefs(v.datarefs);
        else if (v.command) await executeCommand(v.command);
      } catch (e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    function addButtons() {
      const inNames = inButtons.map(b => b.text);
      const outNames = outButtons.map(b => b.text);
      const inDiv = document.getElementById('internalViews');
      const outDiv = document.getElementById('outViews');
      inButtons.forEach(b => {
        const btn = document.createElement('button');
        btn.style.cssText = (b.style.endsWith(';') ? b.style : b.style + ';') + ' position: absolute;';
        btn.innerText = b.text;
        btn.className = 'btn-view float-btn';
        btn.onclick = () => onButtonClick(b.text);
        inDiv.appendChild(btn);
      });
      outButtons.forEach(b => {
        const btn = document.createElement('button');
        btn.style.cssText = (b.style.endsWith(';') ? b.style : b.style + ';') + ' position: absolute;';
        btn.innerText = b.text;
        btn.className = 'btn-view float-btn';
        btn.onclick = () => onButtonClick(b.text);
        outDiv.appendChild(btn);
      });
      document.getElementById('btnIn').onclick = () => {
        document.getElementById('inFrame').style.display = 'block';
        document.getElementById('outFrame').style.display = 'none';
      };
      document.getElementById('btnOut').onclick = () => {
        document.getElementById('inFrame').style.display = 'none';
        document.getElementById('outFrame').style.display = 'block';
      };
    }

    addButtons();
  </script>
</body>
</html>
